name: scrape-app

services:
  mongo:
    image: mongo:7.0.12
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db
    networks:
      - scrape-app
  scrape-service:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./apps/api/.env
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    networks:
      - scrape-app
    ports:
      - 5000:5000
    depends_on:
      - mongo
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    networks:
      - scrape-app
    ports:
      - 5173:5173
    command: npm run dev -- --host
    depends_on:
      - scrape-service
volumes:
  mongo_data:
networks:
  scrape-app:
    driver: bridge
